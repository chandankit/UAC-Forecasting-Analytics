[pytest]
# Fast suite for the descriptive pipeline analytics, the dashboard integration and document consistency (python -m pytest).
# The full forecasting QA suite has its own configuration: python -m pytest QA_Testing/pytest_suite -c QA_Testing/pytest_suite/pytest.ini
testpaths = tests
pythonpath = .
addopts = -p no:cacheprovider -ra
markers =
    slow: launches a real Streamlit server or a subprocess (about 10-60 s each)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
